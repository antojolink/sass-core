name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm test -- --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% |`;
            console.log(["## Cobertura", "| Métrica | % |", "|---|---|",
              row("statements"), row("branches"), row("functions"), row("lines")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/